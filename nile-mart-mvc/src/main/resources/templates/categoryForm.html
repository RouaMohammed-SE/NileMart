<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('New category - Nile Mart')}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>

<h1>New category</h1>

<form class="card" th:action="@{/categories}" th:object="${category}" method="post">
    <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}">
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>
    <div class="field">
        <label for="slug">Slug</label>
        <input type="text" id="slug" th:field="*{slug}" placeholder="mobile-phones">
        <span class="error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></span>
    </div>
    <div class="field">
        <label for="parentSlug">Parent</label>
        <select id="parentSlug" th:field="*{parentSlug}">
            <option value="">None (top level)</option>
            <option th:each="p : ${parents}" th:value="${p.slug}" th:text="${p.name}"></option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('parentSlug')}" th:errors="*{parentSlug}"></span>
    </div>
    <div class="field">
        <label for="displayOrder">Display order</label>
        <input type="text" id="displayOrder" th:field="*{displayOrder}">
        <span class="error" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></span>
    </div>
    <div class="field">
        <label><input type="checkbox" th:field="*{active}"> Active</label>
    </div>
    <button class="btn" type="submit">Save category</button>
</form>
<p><a th:href="@{/categories}">Back to categories</a></p>
</body>
</html>
