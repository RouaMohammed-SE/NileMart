<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Products - Nile Mart')}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>

<h1>Available Products</h1>
<div class="actions"><a class="btn" th:href="@{/products/new}">Add product</a></div>

<table>
    <thead>
    <tr>
        <th>SKU</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Category</th>
        <th>Brand</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td th:text="${row.sku}"></td>
        <td th:text="${row.name}"></td>
        <td th:text="${#numbers.formatDecimal(row.price, 1, 'COMMA', 2, 'POINT')}"></td>
        <td th:text="${row.inStock}"></td>
        <td th:text="${row.categoryName}"></td>
        <td th:text="${row.brandName}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
